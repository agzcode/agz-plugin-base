# Verify the mirror and public override hashes, then install, test and check each template and example.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/sync-from-source.mjs --verify

      - run: node scripts/check-all.mjs
